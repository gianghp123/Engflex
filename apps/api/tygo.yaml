# tygo codegen: Go DTOs -> TypeScript contracts in ../../packages/contracts.
# Run from this directory: `tygo generate` (or `make contracts`).
# Generated files are overwritten; shared hand-written code goes in
# packages/contracts/src/index.ts (barrel, never touched by tygo).
#
# Cross-package references (enums.*, common.ListParams) are invisible to
# tygo's per-package type resolution: without these global mappings they
# degrade to `unknown /* pkg.Type */`. Mapped values are bare TS identifiers
# declared ambiently in packages/contracts/src/index.ts (declare global), so
# generated files stay import-free (no per-package frontmatter).
type_mappings:
  time.Time: "string /* RFC3339 */"
  "enums.ActivityType": "ActivityType"
  "enums.AttemptType": "AttemptType"
  "enums.AttemptStatus": "AttemptStatus"
  "enums.ExamMode": "ExamMode"
  "enums.ExamType": "ExamType"
  "enums.ExamSkill": "ExamSkill"
  "enums.ExamSubType": "ExamSubType"
  "enums.CEFR": "CEFR"
  "enums.ConversationMode": "ConversationMode"
  "enums.ConversationStatus": "ConversationStatus"
  "enums.Goal": "Goal"
  "enums.Gender": "Gender"
  "enums.InterestTopic": "InterestTopic"
  "enums.LessonStatus": "LessonStatus"
  "enums.Level": "Level"
  "enums.PublishStatus": "PublishStatus"
  "enums.ScenarioDifficulty": "ScenarioDifficulty"
  "enums.TurnRole": "TurnRole"
  "enums.VocabularySort": "VocabularySort"
  "enums.VocabularySource": "VocabularySource"
  "enums.VocabularyDomain": "VocabularyDomain"
  "enums.VocabularyPartOfSpeech": "VocabularyPartOfSpeech"
  "enums.ContentType": "ContentType"
  "enums.SpanStatus": "SpanStatus"
  "enums.RelevanceStatus": "RelevanceStatus"
  "enums.SubscriptionStatus": "SubscriptionStatus"
  "enums.SubscriptionPlan": "SubscriptionPlan"
  "enums.PaymentTransactionStatus": "PaymentTransactionStatus"
  # embedded by list request DTOs tagged `tstype:",extends"`
  "common.ListParams": "ListParams"
  # embedded by the LLM-triggering request DTOs tagged `tstype:",extends"`
  "llm.LanguageParam": "LanguageParam"

packages:
  - path: "engflex-api/internal/common"
    output_path: "../../packages/contracts/src/common.ts"
    # AppError never crosses the wire (only its message, inside the envelope).
    exclude_files:
      - "errors.go"

  # Shared enums: one Go file per enum type -> const + union literal types.
  - path: "engflex-api/internal/common/enums"
    output_path: "../../packages/contracts/src/enums.ts"
    enum_style: "union"
    fallback_type: "unknown"
    # UserRole is server-only (Clerk claim -> middleware gate); it must not
    # cross the wire. Same precedent as errors.go above.
    exclude_files:
      - "user_role.go"

  # Shared LLM request fragments: language.go only. client.go and schema.go are
  # runtime types — the client interface and the generated JSON schemas — and
  # must not cross the wire, so they are excluded rather than the package split.
  - path: "engflex-api/internal/llm"
    output_path: "../../packages/contracts/src/llm.ts"
    fallback_type: "unknown"
    exclude_files:
      - "client.go"
      - "schema.go"

  # Module wire DTOs: dtos/requests + dtos/responses per module.
  - path: "engflex-api/internal/modules/profiles/dtos/requests"
    output_path: "../../packages/contracts/src/profiles-requests.ts"
    fallback_type: "unknown"
  - path: "engflex-api/internal/modules/profiles/dtos/responses"
    output_path: "../../packages/contracts/src/profiles-responses.ts"
    fallback_type: "unknown"

  - path: "engflex-api/internal/modules/lessons/dtos/requests"
    output_path: "../../packages/contracts/src/lessons-requests.ts"
    fallback_type: "unknown"
  - path: "engflex-api/internal/modules/lessons/dtos/responses"
    output_path: "../../packages/contracts/src/lessons-responses.ts"
    fallback_type: "unknown"

  - path: "engflex-api/internal/modules/scenarios/dtos/requests"
    output_path: "../../packages/contracts/src/scenarios-requests.ts"
    fallback_type: "unknown"
  - path: "engflex-api/internal/modules/scenarios/dtos/responses"
    output_path: "../../packages/contracts/src/scenarios-responses.ts"
    fallback_type: "unknown"

  - path: "engflex-api/internal/modules/videos/dtos/requests"
    output_path: "../../packages/contracts/src/videos-requests.ts"
    fallback_type: "unknown"
  - path: "engflex-api/internal/modules/videos/dtos/responses"
    output_path: "../../packages/contracts/src/videos-responses.ts"
    fallback_type: "unknown"

  - path: "engflex-api/internal/modules/conversations/dtos/requests"
