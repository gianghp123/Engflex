packages:
  # specify a package in a direct subdir of the root
  - "apps/*"
  # all packages in direct subdirs of packages/
  - "packages/*"
  # end-to-end tests (own Playwright package)
  - "tests/e2e"
  # all packages in subdirs of components/
  - "components/**"
  # exclude packages that are inside test directories
  - "!**/test/**"
allowBuilds:
  bufferutil: false
  core-js: false
  utf-8-validate: false
# Peer mismatches from @clerk/ui's Solana wallet subtree (unused by the web
# app): @solana/codecs-* want typescript ^5 but we build with TS 6, and
# ws@7's optional utf-8-validate peer wants ^5 while rpc-websockets brings 6.
peerDependencyRules:
  allowedVersions:
    typescript: "6"
    utf-8-validate: "6"
