[project]
name = "engflex-toeic-pipeline"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pymupdf>=1.26,<2", "pillow>=11,<13", "mutagen>=1.47,<2",
  "pydantic>=2.12,<3", "rapidocr-onnxruntime>=1.4.4,<2",
  "faster-whisper>=1.2,<2", "httpx>=0.28,<1", "rapidfuzz>=3.14,<4",
  "av>=14,<16",
  "filelock>=3,<5",
]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
study4 = ["mcp>=1.20,<2", "python-dotenv>=1,<2", "minio>=7.2,<8", "psycopg[binary]>=3.2,<4"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
