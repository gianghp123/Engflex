# Web on the compose strategy (migrated for coolify.traefik.middlewares,
# which standard apps strip from custom labels). Labels-only limiter, no
# @file (dynamic configs have no IaC home). The shorthand attaches to every
# generated router; headerless traffic falls back to per-IP buckets (proven
# live), so the LAN needs no special case. Build notes mirror
# infrastructure/composes/voice/compose.yaml: repo-root context, bulk-filled ${VAR}
# refs (no per-key env resources).
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    expose:
      - "3000"
    environment:
      - API_INTERNAL_URL=${API_INTERNAL_URL}
      - MEDIA_INTERNAL_ENDPOINT=${MEDIA_INTERNAL_ENDPOINT}
      - MEDIA_BUCKET=${MEDIA_BUCKET}
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    labels:
      # Edge IP limiter (Coolify shorthand — Traefik applies it to every
      # route and has no path exclusion). Sized for a cold client load: the
      # SSR document + serverFn RPCs + cache-miss chunks burst ~30 requests
      # before the module graph settles, so the old 60/20 429'd first visits.
      # Coolify's own documented example is average=100/burst=50; 300/100
      # keeps an edge safety net without throttling a normal page load.
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.average=300
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.period=1m
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.burst=100
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.sourcecriterion.requestheadername=CF-Connecting-IP
      - coolify.traefik.middlewares=engflex-ip-limit
    networks:
      - coolify
    restart: unless-stopped

networks:
  coolify:
    external: true
