# TEMPORARY EXPERIMENT (compose + shorthand test — delete after verdict):
# same web Dockerfile via the compose strategy, to test whether
# `coolify.traefik.middlewares` attaches on compose applications.
# Build/dockerfile notes mirror infrastructure/voice/compose.yaml:
# repo-root context, bulk-filled ${VAR} refs (no per-key env resources).
services:
  web-staging:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    expose:
      - "3000"
    environment:
      - API_INTERNAL_URL=${API_INTERNAL_URL}
      - MEDIA_INTERNAL_ENDPOINT=${MEDIA_INTERNAL_ENDPOINT}
      - MEDIA_BUCKET=${MEDIA_BUCKET}
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    labels:
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.average=60
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.period=1m
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.burst=20
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.sourcecriterion.requestheadername=CF-Connecting-IP
      - coolify.traefik.middlewares=engflex-ip-limit
      # Explicit LAN router (merge test): if custom traefik.* router labels
      # coexist with generated ones, this gzip-only router serves LAN while
      # the generated router carries the limiter. If generation vanishes
      # instead (replace semantics like standard apps), LAN 404s and the
      # compose path is declared unfit for mixed routing.
      - traefik.http.routers.staging-lan-test.rule=Host(`engflex-web-staging.192-168-1-10.sslip.io`) && PathPrefix(`/`)
      - traefik.http.routers.staging-lan-test.priority=1000
      - traefik.http.routers.staging-lan-test.entrypoints=http
      - traefik.http.routers.staging-lan-test.middlewares=gzip
      - traefik.http.routers.staging-lan-test.service=staging-lan-test
      - traefik.http.services.staging-lan-test.loadbalancer.server.port=3000
    networks:
      coolify:
        aliases:
          - engflex-web-staging
    restart: unless-stopped

networks:
  coolify:
    external: true
