# TEMPORARY EXPERIMENT (compose + shorthand test — delete after verdict):
# same web Dockerfile via the compose strategy, to test whether
# `coolify.traefik.middlewares` attaches on compose applications.
# Build/dockerfile notes mirror infrastructure/voice/compose.yaml:
# repo-root context, bulk-filled ${VAR} refs (no per-key env resources).
services:
  web-staging:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    expose:
      - "3000"
    environment:
      - API_INTERNAL_URL=${API_INTERNAL_URL}
      - MEDIA_INTERNAL_ENDPOINT=${MEDIA_INTERNAL_ENDPOINT}
      - MEDIA_BUCKET=${MEDIA_BUCKET}
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    labels:
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.average=60
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.period=1m
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.burst=20
      - traefik.http.middlewares.engflex-ip-limit.ratelimit.sourcecriterion.requestheadername=CF-Connecting-IP
      - coolify.traefik.middlewares=engflex-ip-limit
    networks:
      coolify:
        aliases:
          - engflex-web-staging
    restart: unless-stopped

networks:
  coolify:
    external: true
