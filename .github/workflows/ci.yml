name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engflex_test
          POSTGRES_PASSWORD: engflex_test
          POSTGRES_DB: engflex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engflex_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://engflex_test:engflex_test@localhost:5432/engflex_test?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: swagger docs (gitignored, generated like Dockerfile)
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          make swagger
      - name: gofmt
        run: test -z "$(gofmt -l internal/)"
      - name: migrate clean PostgreSQL and verify reversible chain
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
          goose -dir internal/database/migrations postgres "$TEST_DATABASE_URL" up
          goose -dir internal/database/migrations postgres "$TEST_DATABASE_URL" reset
          goose -dir internal/database/migrations postgres "$TEST_DATABASE_URL" up
      - run: python scripts/check-module-boundaries.py
      - name: provider-free release probe regression
        run: python -m unittest discover -s ../../infrastructure/scripts -p test_smoke.py -v
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: concurrency race regression (Linux)
        run: go test -race ./internal/database/repositories/tests ./internal/modules/exams/services/tests ./internal/modules/payments/services -count=1

  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/voice
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6 # uv cache enabled by default; Python comes from pyproject requires-python
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web compile:messages
      - run: pnpm --filter web check
      - run: pnpm --filter web typecheck
      - name: contracts and browser suites compile against generated wire types
        run: |
          pnpm --filter web exec tsc --noEmit -p ../../packages/contracts/tsconfig.json
          pnpm --filter e2e typecheck
      - run: pnpm --filter web check:conventions
      - run: pnpm --filter web build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go install github.com/gzuidhof/tygo@latest
      - run: make contracts
        working-directory: apps/api
      - name: no drift
        run: git diff --exit-code packages/contracts

  terraform:
    # Dev/main only: feature branches run api/voice/web/contracts on every
    # push; terraform validates on push to dev/main, on PRs targeting them,
    # and on every manual dispatch (explicit trigger means full suite).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'dev' ||
      github.ref_name == 'main' ||
      github.base_ref == 'dev' ||
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infrastructure/
      - run: terraform init -backend=false
        working-directory: infrastructure/environments/selfhost
      - run: terraform validate
        working-directory: infrastructure/environments/selfhost
